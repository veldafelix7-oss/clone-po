
name: Build Podium APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Find and Build APK
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Podium-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          
