
      - name: Build APK
        run: |
          cd podium-music-player-0.1.5.1
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Podium-APK
          path: 'podium-music-player-0.1.5.1/**/build/outputs/apk/**/*.apk'
          
